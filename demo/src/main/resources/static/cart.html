    <div id="cartItems"></div>
    <div id="totalPrice"></div>
</div>

<script>
    // Function to display cart items
    function displayCartItems() {
        var cartItemsContainer = document.getElementById('cartItems');
        var totalPriceContainer = document.getElementById('totalPrice');
        var totalPrice = 0;

        cartItemsContainer.innerHTML = '';
        totalPriceContainer.innerHTML = '';

        // Retrieve cart items from local storage
        var cartItems = JSON.parse(localStorage.getItem('cart'));

        if (cartItems && cartItems.length > 0) {
            cartItems.forEach(function(item) {
                var itemElement = document.createElement('div');
                itemElement.classList.add('cart-item');
                itemElement.innerHTML = `
                    <div class="item-info">
                        <img src="/getImage?id=${item.id}&number=0" alt="${item.name}" class="product-image">
                        <div class="product-details">
                            <p class="product-name">${item.name}</p>
                            <div class="quantity-controls">
                                <button class="quantity-btn" onclick="decreaseQuantity(${item.id})">-</button>
                                <span class="quantity">${item.quantity}</span>
                                <button class="quantity-btn" onclick="increaseQuantity(${item.id})">+</button>
                            </div>
                        </div>
                    </div>
                    <p class="product-price">$${item.price * item.quantity}</p>
                    <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
                `;
                cartItemsContainer.appendChild(itemElement);
                totalPrice += item.price * item.quantity;
            });
        } else {
            cartItemsContainer.innerHTML = '<p>Your cart is empty.</p>';
        }

        totalPriceContainer.innerHTML = `<p>Total Price: $${totalPrice}</p>`;
    }

    // Function to remove item from cart
    function removeItem(productId) {
        var cartItems = JSON.parse(localStorage.getItem('cart'));
        cartItems = cartItems.filter(item => item.id !== productId);
        localStorage.setItem('cart', JSON.stringify(cartItems));
        displayCartItems();
    }

    // Function to increase quantity
    function increaseQuantity(productId) {
        var cartItems = JSON.parse(localStorage.getItem('cart'));
        var itemIndex = cartItems.findIndex(item => item.id === productId);
        cartItems[itemIndex].quantity++;
        localStorage.setItem('cart', JSON.stringify(cartItems));
        displayCartItems();
    }

    // Function to decrease quantity
    function decreaseQuantity(productId) {
        var cartItems = JSON.parse(localStorage.getItem('cart'));
        var itemIndex = cartItems.findIndex(item => item.id === productId);
        if (cartItems[itemIndex].quantity > 1) {
            cartItems[itemIndex].quantity--;
            localStorage.setItem('cart', JSON.stringify(cartItems));
            displayCartItems();
        }
    }

    // Display cart items on page load
    displayCartItems();
</script>
